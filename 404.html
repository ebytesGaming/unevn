<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unevn Studios — Maintenance</title>
    <meta name="description" content="Unevn Studios is currently under maintenance." />
    <style>
      :root {
        --bg: #000000;
        --text: #ffffff;
        --muted: #d9d9d9;
        --border: rgba(255,255,255,0.18);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
      }
      main {
        width: min(760px, calc(100vw - 32px));
        border: 1px solid var(--border);
        padding: clamp(24px, 5vw, 56px);
        text-align: center;
      }
      .eyebrow {
        display: inline-block;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 18px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 7vw, 4.4rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }
      p {
        margin: 0 auto;
        max-width: 600px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }
      .btn {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Maintenance</div>
      <h1>Under maintenance</h1>
      <p>This site is currently being updated. Please check back soon.</p>
      <a class="btn" href="/">Refresh</a>
    </main>
  </body>
</html>
