<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unevn Studios — Maintenance</title>
    <meta name="description" content="Unevn Studios is currently under maintenance." />
    <style>
      :root {
        --bg: #000000;
        --panel: #111111;
        --text: #ffffff;
        --muted: #d9d9d9;
        --border: rgba(255, 255, 255, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%),
          #000;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.01);
        padding: clamp(24px, 5vw, 56px);
        text-align: center;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        font-size: 12px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 0 0 5px rgba(255,255,255,0.12);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.4rem, 7vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
        font-weight: 800;
      }

      p {
        margin: 0 auto;
        max-width: 620px;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      button, a {
        appearance: none;
        border: 1px solid var(--border);
        background: #000;
        color: var(--text);
        padding: 12px 18px;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      }

      button:hover, a:hover {
        transform: translateY(-1px);
        background: #111;
        border-color: rgba(255,255,255,0.4);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status">Currently offline</div>
      <h1>Under maintenance</h1>
      <p>
        Unevn Studios is updating the site right now. We’ll be back shortly.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Refresh</button>
      </div>
    </main>
  </body>
</html>
