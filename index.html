<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unevn Studios — Maintenance</title>
    <meta name="description" content="Unevn Studios is currently under maintenance." />
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --muted: #333333;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
      }

      main {
        width: min(860px, calc(100vw - 28px));
        text-align: center;
        padding: 18px 12px 20px;
      }

      .icon-wrap {
        width: 76px;
        height: 76px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #f4f4f4;
        display: grid;
        place-items: center;
      }

      .icon {
        width: 36px;
        height: 36px;
        position: relative;
        display: block;
      }

      .icon::before,
      .icon::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
      }

      .icon::before {
        width: 22px;
        height: 22px;
        border: 4px solid #000;
        border-radius: 50%;
        border-top-color: transparent;
        border-left-color: transparent;
        transform: rotate(45deg);
      }

      .icon::after {
        width: 34px;
        height: 8px;
        background: transparent;
        border: 4px solid #000;
        border-radius: 999px;
        transform: rotate(-45deg) translate(12px, -8px);
      }

      .tag {
        display: inline-block;
        background: #f1f1f1;
        color: #111;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.5rem, 5vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
        font-weight: 800;
      }

      p {
        margin: 0 auto;
        max-width: 700px;
        color: var(--muted);
        font-size: clamp(1rem, 1.8vw, 1.7rem);
        line-height: 1.4;
        font-weight: 400;
      }

      .estimate {
        margin-top: 20px;
        font-size: clamp(1.3rem, 2vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon-wrap" aria-hidden="true">
        <span class="icon"></span>
      </div>

      <div class="tag">Scheduled maintenance</div>

      <h1>We&apos;ll be right back</h1>

      <p>
        Unevn Studios is down for planned maintenance while we ship some improvements.
        Everything should be back online shortly — thank you for your patience.
      </p>

      <div class="estimate">Estimated back by 2:00 PM UTC</div>
    </main>
  </body>
</html>
